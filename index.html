<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Porra Wawawiwa</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');

body{
  margin:0;
  font-family:Inter, Arial, sans-serif;
  background: linear-gradient(135deg,#0b1b3a,#1d4ed8,#b91c1c);
  background-attachment: fixed;
  color:#111;
}

/* contenedor principal */
.container{
  max-width:1200px;
  margin:auto;
  padding:16px;
}

/* título */
h1{
  text-align:center;
  color:white;
  margin:10px 0 20px;
  font-size:28px;
  letter-spacing:1px;
}

/* tarjetas */
.card{
  background:rgba(255,255,255,0.92);
  backdrop-filter: blur(8px);
  border-radius:14px;
  padding:12px;
  margin-bottom:12px;
  box-shadow:0 8px 25px rgba(0,0,0,0.2);
}

/* inputs */
input, select{
  padding:6px 8px;
  border-radius:6px;
  border:1px solid #ddd;
  font-size:13px;
  width:100%;
  box-sizing:border-box;
}

label{
  font-size:12px;
  margin-top:6px;
  display:block;
  color:#333;
}

/* botón */
button{
  background:#facc15;
  border:none;
  padding:12px 18px;
  border-radius:10px;
  font-weight:700;
  cursor:pointer;
  font-size:14px;
  box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

button:hover{
  background:#eab308;
}

/* GRID grupos */
#grupos{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
  gap:10px;
}

/* card grupo compacta */
.group-card h2{
  margin:0 0 5px;
  font-size:14px;
}

.group-card strong{
  font-size:11px;
  color:#555;
}

/* ranking compacto */
.group-card select{
  margin-top:3px;
}

/* partidos */
.match{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding:6px 0;
  border-bottom:1px solid #eee;
}

.match strong{
  font-size:12px;
  min-width:110px;
}

.match select,
.match input{
  font-size:12px;
  padding:5px;
}

/* eliminatorias */
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

@media(max-width:900px){
  .grid{ grid-template-columns:1fr; }
}

/* sección final */
.center{
  text-align:center;
}

/* compactar espacio global */
.card h2{
  font-size:16px;
  margin:0 0 8px;
}

.card h3{
  font-size:13px;
  margin:8px 0 5px;
}

</style>

</head>

<body>

<div class="container">

<h1>🏆 PORRA MUNDIAL 2026</h1>

<div class="card">
  <label>Nombre</label>
  <input id="nombre" />
 <label style="display:none;">Contacto</label>
<input id="contacto" style="display:none;" />

</div>

<div id="grupos"></div>

<div class="card">
  <h2>🏁 Eliminatorias</h2>

  <div class="grid">
    <div>
      <h3>Cuartos</h3>
      <div id="cuartos"></div>
    </div>

    <div>
      <h3>Semis</h3>
      <div id="semis"></div>
    </div>
  </div>

  <h3>Final</h3>

  <label>Campeón</label>
  <select id="campeon"></select>

  <label>Subcampeón</label>
  <select id="subcampeon"></select>
</div>

<div class="card">
  <h2>🎯 Premios</h2>

  <input placeholder="Pichichi" id="pichichi">
  <input placeholder="Pichichi español" id="pichichi_espanol">
  <input placeholder="Mejor portero" id="mejor_portero">
  <input placeholder="Mejor jugador" id="mejor_jugador">
  <input placeholder="Mejor joven" id="mejor_jugador_joven">
</div>

<div class="center">
  <button onclick="enviar()">Enviar porra</button>
</div>

</div>

<script>

// =====================
// EQUIPOS
// =====================
const data = {
 A:["Corea","México","Chequia","Sudáfrica"],
 B:["Suiza","Catar","Canadá","Bosnia"],
 C:["Brasil","Marruecos","Escocia","Haití"],
 D:["Turquía","EE.UU.","Australia","Paraguay"],
 E:["Alemania","Costa de Marfil","Ecuador","Curazao"],
 F:["Holanda","Túnez","Japón","Suecia"],
 G:["Bélgica","Egipto","Nueva Zelanda","Irán"],
 H:["España","Uruguay","Arabia","Cabo Verde"],
 I:["Francia","Senegal","Noruega","Irak"],
 J:["Argentina","Argelia","Austria","Jordania"],
 K:["Portugal","Colombia","Congo","Uzbekistán"],
 L:["Inglaterra","Croacia","Ghana","Panamá"]
};

const allTeams = Object.values(data).flat();

// =====================
// GRUPOS UI
// =====================
const gdiv = document.getElementById("grupos");

Object.keys(data).forEach(g=>{
  const card=document.createElement("div");
  card.className="card group-card";

  let html=`<h2>Grupo ${g}</h2>`;
  html+=`<strong>${data[g].join(", ")}</strong>`;

  for(let i=1;i<=4;i++){
    html+=`
      <label>${i}º
        <select class="ranking" data-group="${g}">
          <option value="">—</option>
          ${data[g].map(t=>`<option value="${t}">${t}</option>`).join("")}
        </select>
      </label>
    `;
  }

  card.innerHTML=html;
  gdiv.appendChild(card);
});

// evitar duplicados
document.addEventListener("change",(e)=>{
  if(!e.target.classList.contains("ranking")) return;

  const group = e.target.dataset.group;
  const selects = document.querySelectorAll(`.ranking[data-group="${group}"]`);

  const used = Array.from(selects).map(s=>s.value).filter(Boolean);

  selects.forEach(sel=>{
    const current = sel.value;
    Array.from(sel.options).forEach(opt=>{
      if(!opt.value) return;
      opt.disabled = used.includes(opt.value) && opt.value !== current;
    });
  });
});

// =====================
// ELIMINATORIAS
// =====================
function fill(id,count){
  const el=document.getElementById(id);
  for(let i=1;i<=count;i++){
    el.innerHTML+=`
      <label>${i}
        <select class="${id}">
          ${allTeams.map(t=>`<option>${t}</option>`).join("")}
        </select>
      </label>
    `;
  }
}

fill("cuartos",8);
fill("semis",4);

const campeon=document.getElementById("campeon");
const sub=document.getElementById("subcampeon");

allTeams.forEach(t=>{
  campeon.innerHTML+=`<option>${t}</option>`;
  sub.innerHTML+=`<option>${t}</option>`;
});

// =====================
// ENVIAR
// =====================
function enviar(){
  const grupos={};

  document.querySelectorAll(".group-card").forEach(c=>{

    const g=c.querySelector("h2").textContent.replace("Grupo ","");
    grupos[g]={clasificacion:[],partidos:{}};

    c.querySelectorAll(".ranking").forEach(r=>{
      grupos[g].clasificacion.push(r.value);
    });
  });

  const json={
    participante:{
      nombre:document.getElementById("nombre").value,
      contacto:document.getElementById("contacto").value
    },
    grupos,
    eliminatorias:{
      cuartos:Array.from(document.querySelectorAll(".cuartos")).map(e=>e.value),
      semifinalistas:Array.from(document.querySelectorAll(".semis")).map(e=>e.value),
      campeon:campeon.value,
      subcampeon:sub.value
    },
    premios:{
      pichichi:document.getElementById("pichichi").value,
      pichichi_espanol:document.getElementById("pichichi_espanol").value,
      mejor_portero:document.getElementById("mejor_portero").value,
      mejor_jugador:document.getElementById("mejor_jugador").value,
      mejor_jugador_joven:document.getElementById("mejor_jugador_joven").value
    }
  };

 fetch("https://script.google.com/macros/s/AKfycbyV5jxoPQB9K29Kp51JBp_Fk3RItjWagFjgDgwt3DM6yKPd9EMsFlLqIBYNyVZwXms1/exec",{
      method: "POST",
    mode: "no-cors",
    headers: {
        "Content-Type": "text/plain"
    },
    body: JSON.stringify({
    sheet: "PARTICIPANTES",
    nombre: json.participante.nombre,
    data: JSON.stringify(json)
  })
});

  alert("Enviado!");
}

</script>

</body>
</html>
